<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ego Content</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><span class="brand">E</span><h1 id="heading">New bookmark</h1><button id="settings" class="quiet" aria-label="Connection settings">Settings</button></header>
<section id="connect" hidden><h2>Connect to Ego</h2><p>Open Content in Ego, choose Chrome extension, and generate a key.</p><label>Extension key<input id="key" type="password" placeholder="egoct_..." autocomplete="off"></label><button id="connect-button" class="primary">Connect</button><button id="back" class="quiet" hidden>Back to bookmark</button><a href="https://ego.kharitonovegor.com/content" target="_blank" rel="noreferrer">Open Ego Content</a></section>
<form id="capture">
<div class="preview"><div id="cover-fallback">&#8599;</div><img id="cover" alt="" hidden><div><label class="sr-only" for="title">Title</label><input id="title" required maxlength="500" placeholder="Page title"><label class="sr-only" for="description">Description</label><textarea id="description" maxlength="4000" rows="2" placeholder="Description"></textarea></div></div>
<label class="field"><span>Note</span><textarea id="notes" rows="4" maxlength="20000" placeholder="What do you want to remember?"></textarea></label>
<label class="field"><span>Collection</span><select id="collection"><option value="">Unsorted</option></select></label>
<label class="field"><span>Tags</span><input id="tags" placeholder="Add tags, separated by commas" list="tag-options"><datalist id="tag-options"></datalist></label>
<label class="field"><span>URL</span><input id="url" required type="url" maxlength="4096"></label>
<div class="favorite-row"><button id="favorite" type="button" aria-pressed="false" aria-label="Favorite">&#9825;</button><span>Favorite</span><span id="kind">Link</span></div>
<footer><a href="https://ego.kharitonovegor.com/content" target="_blank" rel="noreferrer">Open library &#8599;</a><button id="save" class="primary" type="submit" disabled>Save</button></footer>
</form>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script></body></html>
