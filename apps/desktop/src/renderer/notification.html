<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .toast {
        margin: 12px;
        border-radius: 10px;
        opacity: 0;
        transform: translateX(30px);
        animation: slideIn 0.25s ease-out forwards;
      }
      .toast.fade-out { animation: slideOut 0.3s ease-in forwards; }
      [hidden] { display: none !important; }

      .ego {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
      .ego.success { background: rgba(12, 20, 14, 0.96); border: 1px solid rgba(74, 222, 128, 0.25); }
      .ego.error { background: rgba(25, 12, 12, 0.96); border: 1px solid rgba(248, 113, 113, 0.25); }
      .ego.waiting { background: rgba(26, 21, 10, 0.96); border: 1px solid rgba(250, 204, 21, 0.25); }
      .ego .title { font-size: 13px; font-weight: 500; line-height: 18px; }
      .ego.success .title { color: #bbf7d0; }
      .ego.error .title { color: #fecaca; }
      .ego.waiting .title { color: #fef08a; }
      .ego.success .glyph { color: #4ade80; }
      .ego.error .glyph { color: #f87171; }
      .ego.waiting .glyph { color: #facc15; }
      .ego .glyph { flex: 0 0 auto; margin-top: 1px; }

      /* Mirrors a T3 Code thread row: popover #171717, #262626 hairline, muted #a3a3a3. */
      .t3 {
        background: #171717;
        border: 1px solid #262626;
        padding: 11px 13px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 255, 255, 0.03) inset;
      }
      .t3 .row { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .t3 .avatar {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-size: 11px;
        line-height: 1;
      }
      .t3 .avatar img { width: 100%; height: 100%; object-fit: contain; }
      .t3 .avatar.initial { font-size: 9px; font-weight: 700; color: #171717; }
      .t3 .model {
        flex: 0 0 auto;
        margin-left: auto;
        padding-left: 8px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        line-height: 15px;
        color: #8a8a8a;
      }
      .t3 .model svg { display: block; }
      .t3 .project {
        font-size: 12px;
        line-height: 16px;
        color: #d4d4d4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .t3 .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; }
      .t3.success .dot { background: oklch(79.2% 0.209 151.711); }
      .t3.error .dot { background: oklch(70.4% 0.191 22.216); }
      .t3.waiting .dot { background: oklch(82.8% 0.189 84.429); }
      .t3 .stamp {
        flex: 0 0 auto;
        margin-left: auto;
        padding-left: 8px;
        font-size: 11px;
        line-height: 16px;
        font-variant-numeric: tabular-nums;
        color: #737373;
      }
      .t3 .title {
        font-size: 14px;
        line-height: 19px;
        color: #fafafa;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .t3 .foot {
        font-size: 11px;
        line-height: 15px;
        color: #737373;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .t3 .mark { flex: 0 0 auto; margin-left: auto; padding-left: 8px; color: #8a8a8a; }

      @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
      @keyframes slideOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(30px); }
      }
    </style>
  </head>
  <body>
    <div id="ego" class="toast ego" hidden>
      <span class="glyph" id="ego-glyph"></span>
      <span class="title" id="ego-title"></span>
    </div>

    <div id="t3" class="toast t3" hidden>
      <div class="row">
        <span class="avatar" id="t3-avatar" hidden></span>
        <span class="dot"></span>
        <span class="project" id="t3-project"></span>
        <span class="stamp" id="t3-stamp" hidden></span>
      </div>
      <div class="title" id="t3-title"></div>
      <div class="row">
        <span class="foot" id="t3-foot" hidden></span>
        <span class="model" id="t3-model" hidden>
          <span id="t3-glyph"></span>
          <span id="t3-model-name"></span>
        </span>
      </div>
    </div>

    <script>
      const glyphs = {
        success:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        error:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        waiting:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
      }

      const params = new URLSearchParams(window.location.search)
      const tone = glyphs[params.get('type')] ? params.get('type') : 'success'
      const message = params.get('message') || 'Done'

      const fill = (id, value) => {
        const node = document.getElementById(id)
        if (!value) return
        node.textContent = value
        node.hidden = false
      }

      const paintAvatar = () => {
        const node = document.getElementById('t3-avatar')
        const image = params.get('projectImage')
        const emoji = params.get('projectEmoji')
        const initial = params.get('projectInitial')

        if (image && image.startsWith('data:image/')) {
          const img = document.createElement('img')
          img.src = image
          img.alt = ''
          node.appendChild(img)
        } else if (emoji) {
          node.textContent = emoji
        } else if (initial) {
          node.textContent = initial
          node.classList.add('initial')
          node.style.background = params.get('projectColor') || '#a1a1aa'
        } else {
          return
        }
        node.hidden = false
      }

      let toast
      if (params.get('theme') === 't3') {
        toast = document.getElementById('t3')
        document.getElementById('t3-title').textContent = message
        fill('t3-project', params.get('project') || 'T3 Code')
        fill('t3-stamp', params.get('meta'))
        fill('t3-foot', params.get('detail'))
        paintAvatar()

        const model = params.get('model')
        const glyph = params.get('providerGlyph')
        if (model || glyph) {
          if (glyph && glyph.startsWith('<svg')) {
            document.getElementById('t3-glyph').innerHTML = glyph
          }
          document.getElementById('t3-model-name').textContent = model || ''
          document.getElementById('t3-model').hidden = false
        }
      } else {
        toast = document.getElementById('ego')
        document.getElementById('ego-title').textContent = message
        document.getElementById('ego-glyph').innerHTML = glyphs[tone]
      }

      toast.classList.add(tone)
      toast.hidden = false

      const margin = parseFloat(getComputedStyle(toast).marginTop) || 0
      const fit = () =>
        window.api?.resizeNotification?.(
          Math.ceil(toast.getBoundingClientRect().height + margin * 2)
        )

      fit()
      if (document.fonts?.ready) document.fonts.ready.then(fit)

      const hold = Number(params.get('hold'))
      setTimeout(
        () => toast.classList.add('fade-out'),
        Number.isFinite(hold) && hold > 800 ? hold - 800 : 2200
      )
    </script>
  </body>
</html>
