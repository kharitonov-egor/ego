<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .toast {
        margin: 12px;
        border-radius: 10px;
        opacity: 0;
        transform: translateX(30px);
        animation: slideIn 0.25s ease-out forwards;
      }
      .toast.fade-out { animation: slideOut 0.3s ease-in forwards; }
      [hidden] { display: none !important; }

      .ego {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        /* The shadow must fade out inside .toast's margin, or the window edge clips it into a gray box. */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
      .ego { background: rgba(10, 10, 10, 0.97); border: 1px solid #333333; }
      .ego.error { border-color: rgba(251, 113, 133, 0.45); }
      .ego .title { font-size: 13px; font-weight: 600; line-height: 18px; color: #fafafa; }
      .ego.success .glyph { color: #fafafa; }
      .ego.error .glyph { color: #fb7185; }
      .ego.progress .glyph { color: #a3a3a3; }
      .ego.progress .glyph svg { animation: spin 0.9s linear infinite; }
      .ego .glyph { flex: 0 0 auto; margin-top: 1px; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .ego.progress .glyph svg { animation: none; }
      }
      @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
      @keyframes slideOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(30px); }
      }
    </style>
  </head>
  <body>
    <div id="ego" class="toast ego" hidden>
      <span class="glyph" id="ego-glyph"></span>
      <span class="title" id="ego-title"></span>
    </div>

    <script>
      const glyphs = {
        success:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        error:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        progress:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>'
      }

      const params = new URLSearchParams(window.location.search)
      const tone = glyphs[params.get('type')] ? params.get('type') : 'success'
      const message = params.get('message') || 'Done'

      const toast = document.getElementById('ego')
      let fadeTimer = null

      function present(nextTone, nextMessage) {
        document.getElementById('ego-title').textContent = nextMessage
        document.getElementById('ego-glyph').innerHTML = glyphs[nextTone]
        toast.classList.remove(...Object.keys(glyphs))
        toast.classList.add(nextTone)
      }

      function scheduleFade(hold) {
        clearTimeout(fadeTimer)
        fadeTimer = null
        if (hold === 0) return
        fadeTimer = setTimeout(
          () => toast.classList.add('fade-out'),
          Number.isFinite(hold) && hold > 800 ? hold - 800 : 2200
        )
      }

      present(tone, message)
      toast.hidden = false

      const margin = parseFloat(getComputedStyle(toast).marginTop) || 0
      const fit = () =>
        window.api?.resizeNotification?.(
          Math.ceil(toast.getBoundingClientRect().height + margin * 2)
        )

      fit()
      if (document.fonts?.ready) document.fonts.ready.then(fit)

      scheduleFade(Number(params.get('hold')))

      window.api?.onNotificationUpdate?.((update) => {
        present(glyphs[update.tone] ? update.tone : 'success', update.message)
        fit()
        scheduleFade(update.hold)
      })
    </script>
  </body>
</html>
