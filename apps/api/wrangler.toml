name = "ego-money"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Cloudflare's Puppeteer needs Node's Buffer and events.
compatibility_flags = ["nodejs_compat"]

# Screenshots bookmarks that have no cover image.
browser = { binding = "BROWSER" }

# Pulls Google Health, Google Calendar, and the work Trello board into D1 so devices find fresh data without waiting on them.
[triggers]
# The second one backs D1 up to R2 at 07:00 UTC. It must match BACKUP_CRON in src/backup.ts.
crons = ["*/15 * * * *", "0 7 * * *"]

[vars]
D1_ACCOUNT_ID = "92315e9c86dc9762b0924de19d20b10b"
D1_DATABASE_ID = "efd88bbb-8dca-4164-b3e5-b8040572551e"
# The web app, and its dev server. Only these origins get CORS headers or a sign-in sent back to them.
WEB_ORIGINS = "https://ego.kharitonovegor.com, http://localhost:5173"
# Docket links point here. Vercel passes /docket/* on this domain through to the Worker.
DOCKET_BASE_URL = "https://ego.kharitonovegor.com"

[[d1_databases]]
binding = "DB"
database_name = "ego"
database_id = "efd88bbb-8dca-4164-b3e5-b8040572551e"
migrations_dir = "migrations"

# Diary files. Private: the Worker serves them only to a signed-in device.
[[r2_buckets]]
binding = "DIARY_MEDIA"
bucket_name = "ego-diary"

# Docket HTML, one object per version. Private: the Worker decides who sees each page.
[[r2_buckets]]
binding = "DOCKETS"
bucket_name = "ego-dockets"

# Content covers: screenshots of bookmarked pages. Public, under unguessable names.
[[r2_buckets]]
binding = "CONTENT_PREVIEWS"
bucket_name = "ego-content-previews"

# Daily D1 dumps. No lifecycle rule, so they are kept forever.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "ego-backups"
