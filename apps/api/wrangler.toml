name = "ego-money"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Pulls Google Health into D1 so the phone finds fresh numbers without waiting on Google.
[triggers]
# The second one backs D1 up to R2 at 07:00 UTC. It must match BACKUP_CRON in src/backup.ts.
crons = ["*/15 * * * *", "0 7 * * *"]

[vars]
D1_ACCOUNT_ID = "92315e9c86dc9762b0924de19d20b10b"
D1_DATABASE_ID = "efd88bbb-8dca-4164-b3e5-b8040572551e"

[[d1_databases]]
binding = "DB"
database_name = "ego"
database_id = "efd88bbb-8dca-4164-b3e5-b8040572551e"
migrations_dir = "migrations"

# Diary files. Private: the Worker serves them only to a signed-in device.
[[r2_buckets]]
binding = "DIARY_MEDIA"
bucket_name = "ego-diary"

# Daily D1 dumps. No lifecycle rule, so they are kept forever.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "ego-backups"
