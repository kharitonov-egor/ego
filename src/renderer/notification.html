<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .toast {
        margin: 6px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04);
        opacity: 0;
        transform: translateX(30px);
        animation: slideIn 0.25s ease-out forwards;
      }
      .toast.success {
        background: rgba(12, 20, 14, 0.96);
        border: 1px solid rgba(74, 222, 128, 0.25);
      }
      .toast.error {
        background: rgba(25, 12, 12, 0.96);
        border: 1px solid rgba(248, 113, 113, 0.25);
      }
      .toast.fade-out {
        animation: slideOut 0.3s ease-in forwards;
      }
      .icon {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .success .icon { color: #4ade80; }
      .error .icon { color: #f87171; }
      .text {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .success .text { color: #bbf7d0; }
      .error .text { color: #fecaca; }

      @keyframes slideIn {
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes slideOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(30px); }
      }
    </style>
  </head>
  <body>
    <div id="toast" class="toast">
      <span class="icon" id="icon"></span>
      <span class="text" id="text"></span>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search)
      const type = params.get('type') || 'success'
      const message = params.get('message') || 'Done'

      const toast = document.getElementById('toast')
      const icon = document.getElementById('icon')
      const text = document.getElementById('text')

      toast.classList.add(type)
      text.textContent = message

      if (type === 'success') {
        icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      } else {
        icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
      }

      setTimeout(() => {
        toast.classList.add('fade-out')
      }, 2200)
    </script>
  </body>
</html>
